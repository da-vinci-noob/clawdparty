# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# Six-field cron (leading field = seconds). Sub-minute cadence is required because the
# staleness threshold is 15s — a minute-granularity sweep could not detect it in budget.
default: &default
  harness_healthcheck:
    class: Harness::HealthcheckJob
    queue: default
    schedule: "*/5 * * * * *"

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
