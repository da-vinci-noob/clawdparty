name: web

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "web/**"
      - "packages/**"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund

      # ONE source of truth: Biome + tsc + Vitest, identical in CI and locally
      # (host-only, no Docker). Defined once in bin/tests.
      - name: Checks (bin/tests web)
        run: bin/tests web
