name: api

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "api/**"
      - "packages/**"
      - ".github/workflows/api.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby 4.0.5
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.5
          bundler-cache: true
          working-directory: api

      - name: Prepare databases (primary + queue + cable)
        run: bin/rails db:prepare

      # ONE source of truth, and the ONE group where CI and local differ by EXECUTOR:
      # the gems live in a Docker named volume locally, so `bin/tests api` drives the
      # stack through bin/rubocop / bin/rspec there. On CI the Ruby runner is native
      # and the gems are already installed, so CLAWD_TESTS_NATIVE_API=1 runs
      # `bundle exec rubocop` / `bundle exec rspec` directly — the same commands, no
      # Docker. The projection-equivalence specs (gate 3, Rails half) run INSIDE the
      # full rspec; folded in rather than repeated so the command lives in one place.
      - name: Checks (bin/tests api)
        working-directory: .
        env:
          CLAWD_TESTS_NATIVE_API: "1"
        run: bin/tests api
