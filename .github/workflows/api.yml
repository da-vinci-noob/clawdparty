name: api

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "api/**"
      - "packages/**"
      - ".github/workflows/api.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby 4.0.5
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.5
          bundler-cache: true
          working-directory: api

      - name: Prepare databases (primary + queue + cable)
        run: bin/rails db:prepare

      - name: RuboCop
        run: bundle exec rubocop

      - name: RSpec
        run: bundle exec rspec

      # Gate 3, Rails half. Already inside the RSpec run above — repeated as its own
      # REQUIRED step for the same reason the harness gates are: this is what proves a
      # divergence between the record and its projection is DETECTED, and a projection that
      # is quietly wrong looks complete. One line among 431 is not legible enough for the
      # check that decides whether the feed can be trusted.
      - name: Projection equivalence gate
        run: bundle exec rspec spec/services/events/projection_check_spec.rb spec/services/events/rederive_spec.rb
