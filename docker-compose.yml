# clawdparty dev stack — one container per process.
#
# Four services, one process each: rails (Puma), jobs (Solid Queue), postgres, vite
# (dev SPA server). Only `rails` publishes a port (3000 -> LAN); vite is
# compose-network only.
#
# The HARNESS IS NOT HERE. It runs as a host process  so it reaches any
# project on the filesystem with no per-project mount, resolves symlinks that leave a
# project directory, sees the host toolchain and SSH agent, and reads credential
# locations a container cannot — notably the macOS Keychain. `bin/start` brings up
# this file AND the host harness; `bin/harness` manages it alone.
#
# Because the harness is not a compose service, no service here bind-mounts the
# target repo at an identical host path any more: the harness edits worktrees
# directly on the host, and Rails only needs the repo for git operations.
# Run with `bin/start` (after `bin/setup`). See docs/PLAN.md §2/§3 + CLAUDE.md.

# Pin the project name so the whole stack always comes up under `clawdparty`
# (containers `clawdparty-<service>-1`), independent of the host directory name.
name: clawdparty

services:
  # --- PostgreSQL 18 -------------------------------------------------------
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      # postgres:18+ stores data in a version subdir and expects the volume at
      # /var/lib/postgresql (NOT /var/lib/postgresql/data — the 18 image rejects
      # the old path as an "unused mount/volume" and refuses to start).
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 20
    # No `ports:` — postgres is reachable only on the compose network.

  # --- Rails 8 API + ActionCable (Puma) — the ONLY published port ----------
  rails:
    build:
      context: .
      dockerfile: docker/rails.Dockerfile
    restart: unless-stopped
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      # The harness is a HOST process, so Rails reaches it across the bridge.
      HARNESS_URL: ${HARNESS_URL:-http://host.docker.internal:8787}
      # Still the identical host path, now for a different reason: the harness writes
      # worktree gitdir metadata with HOST absolute paths, so Rails must use the same
      # string to open them. This is the one place the identical-path mount survives.
      REPO_ROOT: ${TARGET_REPO_PATH:-/repo}
    extra_hosts:
      # Resolves the host from inside the container. On Docker Desktop (macOS,
      # Windows) this reaches a harness bound to 127.0.0.1, because the VM's proxy
      # forwards to host loopback. On LINUX it maps to the bridge gateway and does
      # NOT proxy loopback — a Linux developer must set HARNESS_BIND_HOST to the
      # bridge gateway (commonly 172.17.0.1) so the harness is reachable while still
      # not on the LAN.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api:/app:delegated
      - bundle:/usr/local/bundle
      # The frozen contracts package, mounted at /packages so the app's
      # Rails.root.join("..","packages",...) resolves identically in-container
      # and on the host (fake-Claude replay reads the fixture + CONTRACT_VERSION).
      - ./packages:/packages:ro
      # Target repo at the IDENTICAL host path. Rails runs the git operations
      # (worktree create, diff, approve-commit, reject-revert) against worktrees the
      # host harness wrote, whose gitdir files hold absolute HOST paths.
      # TARGET_REPO_PATH must be an ABSOLUTE host path (the parent of your repos).
      - ${TARGET_REPO_PATH:-/repo}:${TARGET_REPO_PATH:-/repo}
    depends_on:
      postgres:
        condition: service_healthy

  # --- Solid Queue supervisor — same image as rails, different command -----
  jobs:
    build:
      context: .
      dockerfile: docker/rails.Dockerfile
    restart: unless-stopped
    command: ["bin/jobs"]
    env_file:
      - path: .env.local
        required: false
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      HARNESS_URL: ${HARNESS_URL:-http://host.docker.internal:8787}
      REPO_ROOT: ${TARGET_REPO_PATH:-/repo}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api:/app:delegated
      - bundle:/usr/local/bundle
      - ./packages:/packages:ro
      # The repo mount `jobs` lacked. Harness::HealthcheckJob does not touch
      # git today, but it shares this image with `rails` and every git-touching
      # service needs the same path — omitting it made "works in rails, NoMethodError
      # in jobs" a latent trap for the first job that reaches for a worktree.
      - ${TARGET_REPO_PATH:-/repo}:${TARGET_REPO_PATH:-/repo}
    depends_on:
      postgres:
        condition: service_healthy
      rails:
        condition: service_started
    # No `ports:` — jobs runs no server. restart: unless-stopped doubles as the
    # restart-until-ready posture if it boots before rails has prepared the queue DB.

  # --- Vite dev server (dev only) — UNPUBLISHED ----------------------------
  vite:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Polling so HMR detects host edits over the macOS :delegated bind mount.
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    expose:
      - "5173"
    volumes:
      - ./web:/app:delegated
      - web_node_modules:/app/node_modules
      # The frozen contracts package, mounted at /packages so the
      # web/node_modules/@clawdparty/contracts symlink (../../../packages/contracts
      # → /packages/contracts) resolves in-container — needed once web imports a
      # runtime VALUE from it (type-only imports are erased and never resolved).
      - ./packages:/packages:ro
    # No `ports:` key — the browser reaches the SPA only via the rails reverse-proxy.

volumes:
  pg_data:
  bundle:
  web_node_modules:
